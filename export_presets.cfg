[runnable_presets]

"Android"="Android"

; ============================================================
; 安卓专用工程（2026-10-08）：只剩这一个预设，Windows 那个留在 PC 工程里。
;
; 关于 Gradle：这份工程里 `per_pixel_transparency/allowed=false`（手机不需要透明），
; 所以**默认模板就能导**，不会撞上"要透明必须用 Gradle 构建"那道墙。
; 2026-10-09（阶段 5c）：为了"系统分享图片给她"能用，本项目**第一次切到 Gradle 构建** ✗。
; 那一串坑（构建模板装到哪、android/.build_version 的内容、国内镜像、intent-filter 挂 alias）
; 完整记在 scripts/mobile/pet_mobile.gd 头部的 5c 那段 ✓ —— 动这套设置前先看一遍 ✓
; ⚠️ android/build/ 里的**阿里云 / 腾讯镜像别删** ✗（删了在国内就编不动 ✓）
;
; 关于"清单 / 资源里那些自己加的声明放哪"（阶段 13，2026-10-10 顺手记清楚 ✓）：
;   一律放**自定义 flavor 源集** `android/build/src/standard/` ✓ —— 放这里 Godot 导出时不碰 ✓：
;     · `src/standard/AndroidManifest.xml`：悬浮球 / 截屏 / 保活那几个 `<service>`、`<receiver>`、
;       权限、以及 `activity-alias`（阶段 5c 的分享入口 ✓）；
;     · `src/standard/res/`：阶段 13 的无障碍截屏要的 `xml/pet_accessibility.xml` +
;       `values/strings.xml` ✓。
;   ⚠️ 别放 `src/main/` 或 `src/debug/` ✗ —— 那两份 Godot 每次导出都会**重写**（实测过 ✓，
;      写进去的东西下一次导出就没了 ✓）。完整来龙去脉见 `src/standard/AndroidManifest.xml` 头部 ✓。
; ============================================================
